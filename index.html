
<!DOCTYPE html>
<html lang="da">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SP.M Banko</title>

<style>

/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    font-family: Arial, sans-serif;

    background: #20252f;

    color: white;

    overflow: hidden;
}


/* =========================================================
   GAME MASTER
   ========================================================= */

#app {

    width: 100%;
    height: 100vh;

    padding: 20px;

    background: #20252f;
}

.layout {

    display: grid;

    grid-template-columns:
        minmax(430px, 58%)
        1fr;

    gap: 25px;

    width: 100%;
    height: 100%;
}


/* =========================================================
   NUMBER TABLE
   ========================================================= */

.left {

    display: flex;

    align-items: center;
    justify-content: center;
}

.number-table {

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        repeat(10, 1fr);

    grid-template-rows:
        repeat(9, 1fr);

    gap: 6px;
}

.cell {

    background: #2b323e;

    border: 2px solid #46505f;

    border-radius: 8px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size:
        clamp(
            18px,
            2.1vw,
            32px
        );

    font-weight: bold;

    cursor: pointer;

    transition:
        background .15s,
        transform .1s,
        border-color .15s;
}

.cell:hover {

    transform: scale(1.03);

    border-color: #738094;
}

.cell.drawn {

    background: #36b37e;

    border-color: #61d7a3;
}


/* =========================================================
   RIGHT SIDE
   ========================================================= */

.right {

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    min-width: 0;
}

#lingo {

    min-height: 70px;

    font-size:
        clamp(
            28px,
            3.5vw,
            58px
        );

    font-weight: bold;

    margin-bottom: 15px;
}

#current {

    font-size:
        clamp(
            110px,
            15vw,
            250px
        );

    font-weight: bold;

    line-height: .85;

    margin-bottom: 35px;
}


/* =========================================================
   MAIN BUTTON AREA
   ========================================================= */

.buttons {

    width:
        min(
            390px,
            95%
        );

    display: flex;

    flex-direction: column;

    gap: 12px;
}

button {

    border: none;

    border-radius: 10px;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 23px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .1s,
        filter .1s,
        opacity .15s;
}

button:hover {

    filter: brightness(1.08);
}

button:active {

    transform: scale(.98);
}


/* =========================================================
   RESET
   ========================================================= */

#reset {

    width: 100%;

    height: 65px;

    background: #d64545;
}


/* =========================================================
   DRAW
   ========================================================= */

#draw {

    width: 100%;

    height: 75px;

    background: #36b37e;

    font-size: 28px;

    transition:
        opacity .15s,
        transform .1s;
}

#draw.locked {

    opacity: .35;

    cursor: not-allowed;
}

#draw:disabled {

    cursor: not-allowed;
}


/* =========================================================
   BANKO TYPE ROWS
   ========================================================= */

/*
   Each row contains TWO separate buttons.

   LEFT:
   banko type

   RIGHT:
   Banko action

   They touch each other visually but remain
   separate HTML buttons.
*/

.banko-row {

    width: 100%;

    display: flex;

    gap: 3px;
}


/* =========================================================
   BANKO TYPE BUTTON
   ========================================================= */

.banko-type-button {

    flex: 1;

    min-width: 0;

    height: 58px;

    background: #3b4352;

    border-radius: 10px 3px 3px 10px;

    font-size: 19px;

    border: 2px solid transparent;
}

.banko-type-button:hover {

    background: #4b5566;
}

.banko-type-button.selected {

    background: #36b37e;

    border-color: white;

    box-shadow:
        0 0 0 1px white;
}


/* =========================================================
   SEPARATE BANKO BUTTON
   ========================================================= */

.banko-action-button {

    width: 125px;

    flex-shrink: 0;

    height: 58px;

    background: #7b61ff;

    border-radius:
        3px
        10px
        10px
        3px;

    font-size: 19px;

    border: 2px solid transparent;
}

.banko-action-button:hover {

    background: #8d76ff;
}


/* =========================================================
   PLAYER SCREEN BUTTON
   ========================================================= */

#player {

    width: 100%;

    height: 65px;

    background: #5865f2;

    margin-top: 4px;
}


/* =========================================================
   GAME MASTER BANKO OVERLAY
   ========================================================= */

#gmBanko {

    position: fixed;

    inset: 0;

    z-index: 150;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size:
        clamp(
            100px,
            22vw,
            360px
        );

    font-weight: 900;

    color: white;

    background:
        rgba(
            16,
            65,
            39,
            .94
        );

    text-shadow:
        0 0 18px
        rgba(255,255,255,.55),

        0 6px 0
        #b51f2a;

    border:
        18px solid #b51f2a;

    box-shadow:
        inset
        0 0 0 12px
        #f5d76e;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s;
}

#gmBanko.show {

    opacity: 1;
}


/* =========================================================
   GAME MASTER CONFETTI
   ========================================================= */

.confetti {

    position: fixed;

    top: -20px;

    width: 12px;
    height: 18px;

    z-index: 200;

    pointer-events: none;

    animation:
        confettiFall
        2.4s
        linear
        forwards;
}

@keyframes confettiFall {

    to {

        transform:
            translate3d(
                var(--x),
                110vh,
                0
            )
            rotate(720deg);
    }
}


/* =========================================================
   CHRISTMAS DECOR
   ========================================================= */

.christmas-decor {

    position: fixed;

    z-index: 210;

    pointer-events: none;

    font-size:
        clamp(
            28px,
            4vw,
            62px
        );

    line-height: 1;

    animation:
        christmasFloat
        2.8s
        ease-in-out
        infinite;
}

@keyframes christmasFloat {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-5deg);
    }

    50% {

        transform:
            translateY(-12px)
            rotate(5deg);
    }
}

.christmas-decor.candy-left {

    left: 2vw;
    top: 4vh;
}

.christmas-decor.candy-right {

    right: 2vw;
    top: 4vh;

    animation-delay: .5s;
}

.christmas-decor.star-left {

    left: 4vw;
    bottom: 7vh;

    animation-delay: .9s;
}

.christmas-decor.star-right {

    right: 4vw;
    bottom: 7vh;

    animation-delay: 1.3s;
}

.christmas-decor.tree-left {

    left: 1vw;
    top: 42%;

    animation-delay: .2s;
}

.christmas-decor.tree-right {

    right: 1vw;
    top: 42%;

    animation-delay: .7s;
}


/* =========================================================
   PLAYER SCREEN
   ========================================================= */

.player-screen {

    position: fixed;

    inset: 0;

    background: #20252f;

    z-index: 500;

    display: none;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    overflow: hidden;

    --ball-area-height: 360px;
}

.player-screen.active {

    display: flex;
}


/* =========================================================
   PLAYER BANKO TYPE
   ========================================================= */

.player-banko-type {

    position: absolute;

    top: 25px;

    left: 0;
    right: 0;

    z-index: 20;

    font-size:
        clamp(
            35px,
            5vw,
            80px
        );

    font-weight: bold;

    text-align: center;
}


/* =========================================================
   PLAYER NUMBER
   ========================================================= */

.player-number-area {

    position: absolute;

    top: 20px;
    left: 20px;
    right: 20px;

    bottom:
        var(--ball-area-height);

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.player-number {

    font-size:
        clamp(
            150px,
            min(30vw, 38vh),
            440px
        );

    line-height: .9;

    font-weight: bold;
}


/* =========================================================
   PLAYER BALL AREA
   ========================================================= */

.player-ball-area {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    height:
        var(--ball-area-height);

    overflow: visible;

    z-index: 5;
}

.player-balls {

    position: absolute;

    left: 20px;
    right: 20px;

    bottom: 20px;

    height:
        calc(
            100% - 40px
        );

    overflow: visible;
}


/* =========================================================
   PLAYER BALLS
   ========================================================= */

.player-ball,
.moving-player-ball {

    position: absolute;

    width: 66px;
    height: 66px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff 0%,
            #eeeeee 8%,
            #bbbbbb 30%,
            #777777 65%,
            #444444 100%
        );

    color: #111;

    font-size: 25px;

    font-weight: bold;

    box-shadow:
        inset -8px -10px 15px
        rgba(0,0,0,.35),

        inset 7px 7px 12px
        rgba(255,255,255,.45),

        0 5px 12px
        rgba(0,0,0,.4);

    transform-origin: center;

    user-select: none;
}


/* =========================================================
   BALL COLORS
   ========================================================= */

.player-ball.range-1,
.moving-player-ball.range-1 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffb3b3 0%,
            #ff6666 30%,
            #e53935 65%,
            #9b1c1c 100%
        );
}

.player-ball.range-2,
.moving-player-ball.range-2 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff3a6 0%,
            #ffd84d 30%,
            #f4b400 65%,
            #a66f00 100%
        );
}

.player-ball.range-3,
.moving-player-ball.range-3 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #b8f5c0 0%,
            #59d66f 30%,
            #22a447 65%,
            #12652c 100%
        );
}

.player-ball.range-4,
.moving-player-ball.range-4 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #b8dcff 0%,
            #5aa9ff 30%,
            #2878d4 65%,
            #17477f 100%
        );
}

.player-ball.range-5,
.moving-player-ball.range-5 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #e0c1ff 0%,
            #b16cff 30%,
            #7b3fc6 65%,
            #482276 100%
        );
}

.player-ball.range-6,
.moving-player-ball.range-6 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffd0b0 0%,
            #ff8a4c 30%,
            #e85d04 65%,
            #8a3500 100%
        );
}

.player-ball.range-7,
.moving-player-ball.range-7 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffc1e3 0%,
            #ff69b4 30%,
            #d62982 65%,
            #7c164b 100%
        );
}

.player-ball.range-8,
.moving-player-ball.range-8 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #b9f3ee 0%,
            #45d4c7 30%,
            #159c91 65%,
            #0b5e58 100%
        );
}

.player-ball.range-9,
.moving-player-ball.range-9 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffe0a3 0%,
            #d69a3a 30%,
            #a96516 65%,
            #63370b 100%
        );

    color: white;
}

.player-ball.number-90,
.moving-player-ball.number-90 {

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff6b0 0%,
            #ffd700 30%,
            #e5a900 65%,
            #8a5a00 100%
        );

    color: white;

    box-shadow:
        inset -8px -10px 15px
        rgba(0,0,0,.35),

        inset 7px 7px 12px
        rgba(255,255,255,.65),

        0 0 18px
        rgba(255,215,0,.8),

        0 5px 12px
        rgba(0,0,0,.4);
}


/* =========================================================
   RESET BALL ANIMATION
   ========================================================= */

.player-ball.reset-roll,
.moving-player-ball.reset-roll {

    animation:
        resetBallRoll
        1.2s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes resetBallRoll {

    from {

        transform:
            translateX(0)
            rotate(0deg);

        opacity: 1;
    }

    to {

        transform:
            translateX(-150vw)
            rotate(-1080deg);

        opacity: 0;
    }
}


/* =========================================================
   PLAYER BANKO
   ========================================================= */

.player-banko {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size:
        clamp(
            100px,
            22vw,
            360px
        );

    font-weight: 900;

    color: white;

    background:
        rgba(
            16,
            65,
            39,
            .94
        );

    text-shadow:
        0 0 18px
        rgba(255,255,255,.55),

        0 6px 0
        #b51f2a;

    border:
        18px solid #b51f2a;

    box-shadow:
        inset
        0 0 0 12px
        #f5d76e;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s;
}

.player-banko.show {

    opacity: 1;
}


/* =========================================================
   PLAYER CONFETTI
   ========================================================= */

.player-confetti {

    position: fixed;

    top: -20px;

    width: 12px;
    height: 18px;

    z-index: 600;

    pointer-events: none;

    animation:
        playerConfettiFall
        2.4s
        linear
        forwards;
}

@keyframes playerConfettiFall {

    to {

        transform:
            translate3d(
                var(--x),
                110vh,
                0
            )
            rotate(720deg);
    }
}


/* =========================================================
   PLAYER GREENERY
   ========================================================= */

.player-greenery {

    position: absolute;

    z-index: 2;

    pointer-events: none;

    top: 18px;

    left: 0;
    right: 0;

    bottom:
        calc(
            var(--ball-area-height) + 12px
        );

    overflow: hidden;
}

.player-greenery::before,
.player-greenery::after {

    content: "";

    position: absolute;

    top: 12px;

    width:
        min(
            18vw,
            220px
        );

    height: 130px;

    background:

        radial-gradient(
            ellipse at 25% 70%,
            #2f8f4e 0 20%,
            transparent 21%
        ),

        radial-gradient(
            ellipse at 45% 45%,
            #3fa65d 0 20%,
            transparent 21%
        ),

        radial-gradient(
            ellipse at 68% 65%,
            #1f713b 0 22%,
            transparent 23%
        );
}

.player-greenery::before {

    left: 12px;

    transform:
        rotate(-8deg);
}

.player-greenery::after {

    right: 12px;

    transform:
        scaleX(-1)
        rotate(-8deg);
}

.player-greenery-branch {

    position: absolute;

    top: 72px;

    left: 50%;

    width:
        min(
            52vw,
            620px
        );

    height: 90px;

    transform:
        translateX(-50%);

    border-top:
        7px solid #286f3d;

    border-radius: 50%;
}

.player-greenery-ornaments {

    position: absolute;

    top: 20px;

    left: 4%;
    right: 4%;

    height: 105px;
}

.player-greenery-ornaments span {

    position: absolute;

    font-size:
        clamp(
            20px,
            2.4vw,
            34px
        );
}

.player-greenery-ornaments span:nth-child(1) {
    left: 8%;
    top: 28px;
}

.player-greenery-ornaments span:nth-child(2) {
    left: 23%;
    top: 58px;
}

.player-greenery-ornaments span:nth-child(3) {
    left: 38%;
    top: 18px;
}

.player-greenery-ornaments span:nth-child(4) {
    left: 55%;
    top: 55px;
}

.player-greenery-ornaments span:nth-child(5) {
    left: 71%;
    top: 22px;
}

.player-greenery-ornaments span:nth-child(6) {
    left: 86%;
    top: 58px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 850px) {

    html,
    body {

        overflow: auto;
    }

    #app {

        min-height: 100vh;

        height: auto;

        padding: 10px;
    }

    .layout {

        grid-template-columns: 1fr;

        grid-template-rows:
            52vh auto;

        height: auto;

        min-height: 100vh;

        gap: 10px;
    }

    .number-table {

        height: 52vh;

        gap: 4px;
    }

    .cell {

        border-radius: 5px;

        border-width: 1px;
    }

    .right {

        padding-bottom: 20px;
    }

    #current {

        margin-bottom: 20px;
    }

    #lingo {

        min-height: 40px;
    }

    .buttons {

        width: 100%;

        max-width: 500px;
    }

    .banko-type-button {

        font-size: 16px;
    }

    .banko-action-button {

        width: 105px;

        font-size: 16px;
    }

    .player-ball,
    .moving-player-ball {

        width: 50px;
        height: 50px;

        font-size: 20px;
    }
}

/* =========================================================
   FINAL FIX: ALL GAME MASTER CONTENT INSIDE CHRISTMAS FRAME
   Visual layout only. Original JavaScript is unchanged.
   ========================================================= */
#app {
    position: relative;
    isolation: isolate;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    padding: clamp(84px, 10.5vh, 112px) clamp(54px, 4.4vw, 90px) clamp(94px, 11vh, 125px);
    overflow: hidden;
}
#app > .layout {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 58%) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    gap: clamp(14px, 2.8vw, 42px);
    width: 100%;
    height: 100%;
    min-height: 0;
}
#app .left, #app .right { min-width: 0; min-height: 0; }
#app .left { align-items: stretch; overflow: hidden; }
#app .number-table {
    width: 100%; height: 100%; min-height: 0;
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    gap: clamp(3px, .4vw, 6px);
}
#app .cell {
    min-width: 0; min-height: 0; padding: 0;
    font-size: clamp(12px, min(2vw, 3.1vh), 32px);
    line-height: 1;
    border-radius: 7px;
}
#app .right {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    overflow: hidden;
}
#app #lingo {
    min-height: 0;
    font-size: clamp(20px, min(3vw, 4vh), 48px);
    line-height: 1.1;
    margin: 0 0 clamp(4px, 1vh, 12px);
}
#app #current {
    font-size: clamp(64px, min(12vw, 16vh), 180px);
    line-height: 1;
    margin: 0 0 clamp(8px, 1.3vh, 18px);
}
#app .buttons {
    width: min(100%, 450px);
    max-width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(5px, .8vh, 10px);
    flex-shrink: 1;
    min-height: 0;
}
#app #reset, #app #draw, #app #player {
    width: 100%;
    height: clamp(38px, 5.8vh, 62px);
    min-height: 0;
    flex-shrink: 1;
    font-size: clamp(15px, 1.65vw, 23px);
    margin-top: 0;
}
#app .banko-row { width: 100%; gap: 3px; flex-shrink: 1; min-height: 0; }
#app .banko-type-button, #app .banko-action-button {
    height: clamp(36px, 5vh, 54px);
    min-height: 0;
    font-size: clamp(13px, 1.3vw, 19px);
}
#app .banko-type-button { flex: 1; min-width: 0; }
#app .banko-action-button { width: 32%; flex-shrink: 0; }
#app .christmas-frame { pointer-events: none; z-index: 3; }
#app .christmas-frame span { pointer-events: none; }
/* Player view retains its original behavior and decorations. */
@media (max-width: 850px) {
    html, body { overflow: hidden; }
    #app {
        height: 100vh; height: 100dvh; min-height: 0;
        padding: 76px 42px 80px;
    }
    #app > .layout {
        grid-template-columns: minmax(0, 56%) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        height: 100%; min-height: 0;
        gap: 10px;
    }
    #app .number-table { height: 100%; gap: 2px; }
    #app .cell { font-size: clamp(9px, 1.9vw, 18px); border-width: 1px; }

<script>


/* =========================================================
   BANKO LINGO

const bankoLingo = {

    11: "To tynde drenge",

    42: "Svaret på alting",
    50: "Guld",
    53: "Herbie",
    60: "Hurra!",
    66: "Lange tasker",
    68: "Hippietallet",
    69: "Det frække tal",
    77: "To mænd med brækket hals",
    88: "To tykke damer",
    89: "Lille Ole",
    90: "Gamle Ole"

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const table =
    document.getElementById("table");

const current =
    document.getElementById("current");

const lingo =
    document.getElementById("lingo");

const drawButton =
    document.getElementById("draw");

const playerScreen =
    document.getElementById("playerScreen");

const playerNumber =
    document.getElementById("playerNumber");

const playerBankoType =
    document.getElementById("playerBankoType");

const playerBallArea =
    document.getElementById("playerBallArea");

const playerBalls =
    document.getElementById("playerBalls");

const playerBanko =
    document.getElementById("playerBanko");

const gmBanko =
    document.getElementById("gmBanko");


/* =========================================================
   STATE
   ========================================================= */

const drawn =
    new Set();

let drawInProgress =
    false;

let selectedBankoType =
    "";


/* =========================================================
   BROADCAST CHANNEL
   ========================================================= */

const channel =
    typeof BroadcastChannel !== "undefined"
        ? new BroadcastChannel(
            "binglingo-player"
        )
        : null;

let playerWindow =
    null;


/* =========================================================
   AUDIO
   ========================================================= */

const ballRollAudio =
    document.getElementById(
        "ballRollAudio"
    );

ballRollAudio.src =
    "/Bingo/Audio/ball-roll,short.mp3";


const bankoAudio =
    document.getElementById(
        "bankoAudio"
    );


const bankoAudioFiles = {

    "1 række":
        "Audio/bingo-1-raekke.mp3",

    "2 rækker":
        "Audio/bingo-2-raekker.mp3",

    "fuld plade":
        "Audio/bingo-fuld-plade.mp3"

};



function playBallRollSound() {
    ballRollAudio.currentTime = 0;

    ballRollAudio.play().catch(error => {
        console.error(
            "Ball roll audio error:",
            error
        );
    });
}


function stopBallRollSound() {

    ballRollAudio.pause();

    ballRollAudio.currentTime =
        0;
}


function playBankoSound(
    type
) {

    const file =
        bankoAudioFiles[type];

    if (!file) {
        return;
    }


    bankoAudio.pause();

    bankoAudio.currentTime =
        0;

    bankoAudio.src =
        file;


    bankoAudio
        .play()
        .catch(
            error => {

                console.error(
                    "Banko audio could not play:",
                    error
                );

            }
        );

}


/* =========================================================
   FIRST USER CLICK
   ========================================================= */

document.addEventListener(
    "click",

    () => {

        ballRollAudio.load();

        bankoAudio.load();

    },

    {
        once: true
    }

);


/* =========================================================
   SEND TO PLAYER
   ========================================================= */

function sendToPlayer(
    message
) {

    if (channel) {

        channel.postMessage(
            message
        );

    }

}


/* =========================================================
   SELECT BANKO TYPE
   ========================================================= */

function selectBankoType(
    button,
    text
) {

    document
        .querySelectorAll(
            ".banko-type-button"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "selected"
                )
        );


    button.classList.add(
        "selected"
    );


    selectedBankoType =
        text;


    playerBankoType.textContent =
        text;


    sendToPlayer({

        type:
            "bankoType",

        text:
            text

    });

}


/* =========================================================
   OPEN PLAYER SCREEN
   ========================================================= */

function openPlayerScreen() {

    const playerUrl =
        location.href.split("#")[0] +
        "#player";


    playerWindow =
        window.open(

            playerUrl,

            "BinglingoPlayer",

            "fullscreen=yes"

        );


    if (!playerWindow) {

        playerScreen.classList.add(
            "active"
        );

        document.documentElement
            .requestFullscreen?.()
            .catch(
                () => {}
            );

    }

}


/* =========================================================
   PLAYER NUMBER
   ========================================================= */

function updatePlayer(
    number
) {

    playerNumber.textContent =
        number;

}


/* =========================================================
   PLAYER BALL VARIABLES
   ========================================================= */

const PLAYER_BALL_GAP =
    8;

let playerAnimationToken =
    0;


/* =========================================================
   PLAYER BALL SIZE
   ========================================================= */

function getPlayerBallSize() {

    const ball =
        playerBalls.querySelector(
            ".player-ball, .moving-player-ball"
        );


    return ball
        ? ball.getBoundingClientRect().width
        : (
            window.innerWidth <= 700
                ? 50
                : 66
        );

}


/* =========================================================
   PLAYER GRID
   ========================================================= */

function getPlayerGridInfo() {

    const width =
        playerBalls.clientWidth;

    const ballSize =
        getPlayerBallSize();


    const ballsPerRow =
        Math.max(

            1,

            Math.floor(

                (
                    width +
                    PLAYER_BALL_GAP
                )
                /
                (
                    ballSize +
                    PLAYER_BALL_GAP
                )

            )

        );


    return {

        ballsPerRow,

        ballSize

    };

}


/* =========================================================
   PLAYER BALL POSITION
   ========================================================= */

function getPlayerBallPosition(
    index
) {

    const grid =
        getPlayerGridInfo();


    const column =
        index %
        grid.ballsPerRow;


    const row =
        Math.floor(
            index /
            grid.ballsPerRow
        );


    return {

        left:
            column *
            (
                grid.ballSize +
                PLAYER_BALL_GAP
            ),

        bottom:
            row *
            (
                grid.ballSize +
                PLAYER_BALL_GAP
            ),

        row,

        column

    };

}


/* =========================================================
   PLAYER BALL AREA HEIGHT
   ========================================================= */

function updatePlayerBallAreaHeight() {

    const grid =
        getPlayerGridInfo();


    const rows =
        Math.ceil(
            90 /
            grid.ballsPerRow
        );


    const requiredHeight =

        50 +

        rows *
        grid.ballSize +

        (
            rows - 1
        ) *
        PLAYER_BALL_GAP;


    const minimum =
        window.innerWidth <= 700
            ? 290
            : 360;


    const height =
        Math.max(
            minimum,
            requiredHeight
        );


    playerScreen.style.setProperty(

        "--ball-area-height",

        `${height}px`

    );

}


/* =========================================================
   UPDATE PLAYER BALL POSITIONS
   ========================================================= */

function updatePlayerBallPositions() {

    updatePlayerBallAreaHeight();


    playerBalls
        .querySelectorAll(
            ".player-ball"
        )
        .forEach(

            (
                ball,
                index
            ) => {

                const position =
                    getPlayerBallPosition(
                        index
                    );


                ball.style.left =
                    `${position.left}px`;

                ball.style.bottom =
                    `${position.bottom}px`;

                ball.style.transform =
                    "rotate(0deg)";

            }

        );

}


/* =========================================================
   ROLL PLAYER BALL
   ========================================================= */

function rollPlayerBall(
    ball,
    startLeft,
    targetLeft,
    token
) {

    return new Promise(
        resolve => {

            const duration =
                2200;

            const startTime =
                performance.now();


            const distance =
                startLeft -
                targetLeft;


            function animate(
                time
            ) {

                if (
                    token !==
                    playerAnimationToken
                ) {

                    resolve();

                    return;

                }


                const progress =
                    Math.min(

                        (
                            time -
                            startTime
                        ) /
                        duration,

                        1

                    );


                const eased =
                    1 -
                    Math.pow(
                        1 - progress,
                        3
                    );


                const left =
                    startLeft -
                    distance *
                    eased;


                const rotation =
                    -distance *
                    1.8 *
                    progress;


                ball.style.left =
                    `${left}px`;


                ball.style.transform =
                    `rotate(${rotation}deg)`;


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        animate
                    );

                }
                else {

                    ball.style.left =
                        `${targetLeft}px`;

                    ball.style.transform =
                        "rotate(0deg)";


                    resolve();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );

}


/* =========================================================
   BUMP ROW
   ========================================================= */

function bumpPlayerRow(
    targetRow,
    token
) {

    return new Promise(
        resolve => {

            if (
                token !==
                playerAnimationToken
            ) {

                resolve();

                return;

            }


            const balls =
                Array.from(

                    playerBalls
                        .querySelectorAll(
                            ".player-ball"
                        )

                );


            const rowBalls =
                balls.filter(

                    (
                        ball,
                        index
                    ) =>

                        getPlayerBallPosition(
                            index
                        ).row ===
                        targetRow

                );


            if (
                rowBalls.length === 0
            ) {

                resolve();

                return;

            }


            Promise.all(

                rowBalls.map(

                    ball =>

                        ball.animate(

                            [

                                {
                                    transform:
                                        "translateX(0)"
                                },

                                {
                                    transform:
                                        "translateX(-14px)"
                                },

                                {
                                    transform:
                                        "translateX(5px)"
                                },

                                {
                                    transform:
                                        "translateX(0)"
                                }

                            ],

                            {
                                duration: 280,

                                easing:
                                    "ease-out"

                            }

                        ).finished

                )

            ).then(

                () => {

                    resolve();

                }

            );

        }
    );

}


/* =========================================================
   ADD PLAYER BALL
   ========================================================= */

async function addPlayerBall(
    number
) {

    const token =
        playerAnimationToken;


    updatePlayerBallAreaHeight();


    const index =
        playerBalls.querySelectorAll(
            ".player-ball"
        ).length;


    const target =
        getPlayerBallPosition(
            index
        );


    const ball =
        document.createElement(
            "div"
        );


    const range =
        number === 90
            ? 9
            : Math.floor(
                number / 10
            ) + 1;


    ball.className =
        "moving-player-ball range-" +
        range;


    if (
        number === 90
    ) {

        ball.classList.add(
            "number-90"
        );

    }


    ball.textContent =
        number;


    playerBallArea.appendChild(
        ball
    );


    const ballSize =
        getPlayerBallSize();


    const startLeft =
        playerBallArea.clientWidth +
        ballSize;


    const targetLeft =
        20 +
        target.left;


    ball.style.left =
        `${startLeft}px`;


    ball.style.bottom =
        `${20 + target.bottom}px`;


    playBallRollSound();


    await rollPlayerBall(

        ball,

        startLeft,

        targetLeft,

        token

    );


    stopBallRollSound();


    if (
        token !==
        playerAnimationToken
    ) {

        ball.remove();

        return;

    }


    await bumpPlayerRow(

        target.row,

        token

    );


    if (
        token !==
        playerAnimationToken
    ) {

        ball.remove();

        return;

    }


    ball.classList.remove(
        "moving-player-ball"
    );


    ball.classList.add(
        "player-ball"
    );


    playerBalls.appendChild(
        ball
    );


    updatePlayerBallPositions();

}


/* =========================================================
   RESET PLAYER BALLS
   ========================================================= */

function resetPlayerBalls() {

    playerAnimationToken++;


    stopBallRollSound();


    const balls =
        Array.from(

            playerBalls.querySelectorAll(
                ".player-ball, .moving-player-ball"
            )

        );


    balls.forEach(

        ball => {

            ball.classList.add(
                "reset-roll"
            );

        }

    );


    setTimeout(

        () => {

            playerBalls.innerHTML =
                "";

            updatePlayerBallAreaHeight();

        },

        1250

    );

}


/* =========================================================
   PLAYER BANKO
   ========================================================= */

function startBankoParticles(overlay) {
    overlay.querySelectorAll('.banko-falling').forEach(node => node.remove());
    const layer = document.createElement('div');
    layer.className = 'banko-falling';
    overlay.appendChild(layer);
    const rand=(a,b)=>a+Math.random()*(b-a);
    for(let i=0;i<95;i++){
        const el=document.createElement('i'); el.className='banko-snow';
        el.style.setProperty('--left',rand(0,100)+'%');
        el.style.setProperty('--size',rand(2,7)+'px');
        el.style.setProperty('--duration',rand(6,13)+'s');
        el.style.setProperty('--delay',rand(-13,0)+'s');
        el.style.setProperty('--drift',rand(-100,100)+'px');
        layer.appendChild(el);
    }
    const colors=['#ffd34e','#e32530','#f8e5aa','#b91d2b'];
    for(let i=0;i<80;i++){
        const el=document.createElement('i'); el.className='banko-paper';
        el.style.setProperty('--left',rand(0,100)+'%');
        el.style.setProperty('--width',rand(5,10)+'px');
        el.style.setProperty('--height',rand(8,16)+'px');
        el.style.setProperty('--color',colors[i%colors.length]);
        el.style.setProperty('--duration',rand(5,10)+'s');
        el.style.setProperty('--delay',rand(-10,0)+'s');
        el.style.setProperty('--drift',rand(-150,150)+'px');
        el.style.setProperty('--spin',rand(540,1440)+'deg');
        layer.appendChild(el);
    }
    return layer;
}

// Celebration durations by BANKO type (milliseconds).
const BANKO_DURATIONS = {
    "1 række": 9000,
    "2 rækker": 13000,
    "fuld plade": 20000
};

const bankoTimers = new WeakMap();

function showBankoCelebration(overlay, bankoType) {
    // Cancel a previous celebration before starting another one.
    const previousTimer = bankoTimers.get(overlay);
    if (previousTimer) clearTimeout(previousTimer);

    overlay.classList.add('show');
    const layer = startBankoParticles(overlay);
    const duration = BANKO_DURATIONS[bankoType] || 9000;

    const timer = setTimeout(() => {
        overlay.classList.remove('show');
        layer.remove();
        bankoTimers.delete(overlay);
    }, duration);
    bankoTimers.set(overlay, timer);
}

function showPlayerBanko(bankoType) {
    showBankoCelebration(playerBanko, bankoType);
}

/* =========================================================
   GAME MASTER BANKO
   ========================================================= */

function showGameMasterBanko(bankoType) {
    showBankoCelebration(gmBanko, bankoType);
}


/* =========================================================
   TRIGGER BANKO
   ========================================================= */

function triggerBanko(
    bankoType
) {

    selectedBankoType =
        bankoType;


    playerBankoType.textContent =
        bankoType;


    /*
       Make the matching type button
       selected.
    */

    document
        .querySelectorAll(
            ".banko-type-button"
        )
        .forEach(

            button =>
                button.classList.remove(
                    "selected"
                )

        );


    if (
        bankoType ===
        "1 række"
    ) {

        document
            .getElementById(
                "oneRow"
            )
            .classList.add(
                "selected"
            );

    }


    if (
        bankoType ===
        "2 rækker"
    ) {

        document
            .getElementById(
                "twoRows"
            )
            .classList.add(
                "selected"
            );

    }


    if (
        bankoType ===
        "fuld plade"
    ) {

        document
            .getElementById(
                "fullBoard"
            )
            .classList.add(
                "selected"
            );

    }


    /*
       Play the correct Banko audio.
    */

    playBankoSound(
        bankoType
    );


    /*
       Game Master animation.
    */

    showGameMasterBanko(bankoType);


    /*
       Send type to Player Screen.
    */

    sendToPlayer({

        type:
            "bankoType",

        text:
            bankoType

    });


    /*
       Send Banko animation.
    */

    sendToPlayer({

        type:
            "banko",

        winType:
            bankoType

    });

}


/* =========================================================
   NUMBER TABLE
   ========================================================= */

for (
    let number = 1;
    number <= 90;
    number++
) {

    const cell =
        document.createElement(
            "div"
        );


    cell.className =
        "cell";


    cell.textContent =
        number;


    cell.dataset.number =
        number;


    cell.addEventListener(

        "click",

        () =>
            markNumber(
                number
            )

    );


    table.appendChild(
        cell
    );

}


/* =========================================================
   MARK NUMBER
   ========================================================= */

function markNumber(
    number
) {

    if (
        drawn.has(number) ||
        drawInProgress
    ) {

        return;

    }


    drawInProgress =
        true;


    drawButton.disabled =
        true;


    drawButton.classList.add(
        "locked"
    );


    drawn.add(
        number
    );


    const cell =
        table.querySelector(

            `[data-number="${number}"]`

        );


    if (cell) {

        cell.classList.add(
            "drawn"
        );

    }


    current.textContent =
        number;


    lingo.textContent =
        bankoLingo[number] ||
        "";


    updatePlayer(
        number
    );


    sendToPlayer({

        type:
            "draw",

        number:
            number

    });


    setTimeout(

        () => {

            drawInProgress =
                false;


            drawButton.disabled =
                false;


            drawButton.classList.remove(
                "locked"
            );

        },

        2480

    );

}


/* =========================================================
   DRAW BUTTON
   ========================================================= */

drawButton.addEventListener(

    "click",

    () => {

        if (
            drawInProgress ||
            drawn.size >= 90
        ) {

            return;

        }


        let number;


        do {

            number =
                Math.floor(
                    Math.random() * 90
                ) + 1;

        }

        while (
            drawn.has(number)
        );


        markNumber(
            number
        );

    }

);


/* =========================================================
   RESET
   ========================================================= */

document
    .getElementById("reset")
    .addEventListener(

        "click",

        () => {

            drawn.clear();


            table
                .querySelectorAll(
                    ".cell"
                )
                .forEach(

                    cell =>
                        cell.classList.remove(
                            "drawn"
                        )

                );


            current.textContent =
                "-";


            lingo.textContent =
                "";


            selectedBankoType =
                "";


            playerBankoType.textContent =
                "";


            document
                .querySelectorAll(
                    ".banko-type-button"
                )
                .forEach(

                    button =>
                        button.classList.remove(
                            "selected"
                        )

                );


            bankoAudio.pause();

            bankoAudio.currentTime =
                0;


            gmBanko.classList.remove(
                "show"
            );


            resetPlayerBalls();


            updatePlayer(
                "-"
            );


            sendToPlayer({

                type:
                    "reset"

            });

        }

    );

   BANKO TYPE BUTTONS
   ========================================================= */

document

    .addEventListener(

            selectBankoType(

        }

document
    .getElementById("twoRows")
    .addEventListener(

                ),

        }

    );


document
    .getElementById("fullBoard")
    .addEventListener(

            );

        }

    );


/* =========================================================
   SEPARATE BANKO BUTTONS
   ========================================================= */

document
    .getElementById("bankoOneRow")
    .addEventListener(

        "click",

            triggerBanko(
                "1 række"
            );

    );


document
    .getElementById("bankoTwoRows")
    .addEventListener(

        "click",

        () => {

            triggerBanko(
                "2 rækker"
            );

        }

    );


document
    .getElementById("bankoFullBoard")
    .addEventListener(

        "click",

        () => {

            triggerBanko(
                "fuld plade"
            );

        }

    );


/* =========================================================
   PLAYER SCREEN BUTTON
   ========================================================= */

document
    .getElementById("player")
    .addEventListener(

        "click",

        openPlayerScreen

    );


/* =========================================================
   PLAYER CHANNEL
   ========================================================= */

if (channel) {

    channel.addEventListener(

        "message",

        event => {

            const message =
                event.data || {};


            /* DRAW */

            if (
                message.type ===
                "draw"
            ) {

                updatePlayer(
                    message.number
                );


                addPlayerBall(
                    message.number
                );

            }


            /* RESET */

            if (
                message.type ===
                "reset"
            ) {

                updatePlayer(
                    "-"
                );


                playerBankoType.textContent =
                    "";


                resetPlayerBalls();

            }


            /* BANKO TYPE */

            if (
                message.type ===
                "bankoType"
            ) {

                playerBankoType.textContent =
                    message.text;

            }


            /* BANKO */

            if (
                message.type ===
                "banko"
            ) {

                if (
                    message.winType
                ) {

                    playerBankoType.textContent =
                        message.winType;

                }


                updatePlayer(
                    "BANKO!"
                );


                showPlayerBanko(message.winType);

            }

        }

    );

}


/* =========================================================
   PLAYER MODE
   ========================================================= */

if (
    location.hash ===
    "#player"
) {

    document.getElementById(
        "app"
    ).style.display =
        "none";


    document.getElementById(
        "gmBanko"
    ).style.display =
        "none";


    playerScreen.classList.add(
        "active"
    );


    document.title =
        "Binglingo – Player";


    updatePlayerBallAreaHeight();


    document.addEventListener(

        "dblclick",

        () => {

            document.documentElement
                .requestFullscreen?.()
                .catch(
                    () => {}
                );

        }

    );

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(

    "resize",

    () => {

        updatePlayerBallAreaHeight();

        updatePlayerBallPositions();

    }

);
